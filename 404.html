<title>CODNAME</title>
<script>
(function(){
  var path=window.location.pathname;
  var marker='/codname/';
  var base=path.indexOf(marker)!==-1?path.slice(0,path.indexOf(marker)+marker.length):'/';
  var target=base+'index.html'+window.location.search+window.location.hash;
  window.location.replace(target);
})();
</script>
<style>

</head>
